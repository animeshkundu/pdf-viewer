name: CI/CD

# Deployment Strategy:
# - Main branch deploys to root (/)
# - Other branches deploy to test subdirectories (/test-{branch}/)
# - PRs deploy to test subdirectories for preview (/test-{branch}/)
# - Manual workflow dispatch available for deploying any branch

on:
  push:
    branches: 
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allow manual trigger for any branch

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine branch name
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_NAME="${{ github.head_ref }}"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          fi
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "Building for branch: $BRANCH_NAME"

      - name: Clean Vite cache
        run: |
          # Remove any existing vite cache to ensure fresh build with correct base path
          rm -rf node_modules/.vite
          rm -rf .vite
          echo "Vite cache cleared"

      - name: Build application
        run: npm run build
        env:
          # Explicitly set branch name to ensure consistent base path calculation
          # PR events use github.head_ref, push events use github.ref_name
          GITHUB_REF_NAME: ${{ steps.branch.outputs.name }}

      - name: Verify build output and base path
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist/ directory was not created by build"
            exit 1
          fi
          echo "Build artifacts in dist/:"
          ls -lah dist/
          
          # Verify the base path in index.html matches expected branch
          BRANCH_NAME="${{ steps.branch.outputs.name }}"
          if [ "$BRANCH_NAME" = "main" ] || [ "$BRANCH_NAME" = "master" ]; then
            EXPECTED_PATH="/"
          else
            SAFE_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9-]/-/g')
            EXPECTED_PATH="/test-$SAFE_BRANCH/"
          fi
          
          echo "Expected base path: $EXPECTED_PATH"
          echo "Checking index.html for correct paths..."
          
          # Check if index.html contains the expected path in src or href attributes
          if grep -qE "(src|href)=[\"']${EXPECTED_PATH}" dist/index.html; then
            echo "✓ Base path verification passed"
          else
            echo "✗ Base path verification FAILED!"
            echo "Expected paths starting with: $EXPECTED_PATH"
            echo "Actual index.html content:"
            head -30 dist/index.html
            exit 1
          fi
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Verify downloaded artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist/ directory not found after download"
            exit 1
          fi
          echo "Downloaded build artifacts:"
          ls -lah dist/

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, test, e2e]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: Verify downloaded build files
        run: |
          echo "Checking dist/ directory:"
          if [ -d "dist" ]; then
            ls -lah dist/ || echo "dist/ exists but is empty or unreadable"
            echo "File count: $(find dist -type f | wc -l)"
          else
            echo "Error: dist/ directory does not exist"
            exit 1
          fi

      - name: Determine deployment path
        id: deploy_path
        run: |
          # For PRs, use the head branch name; for push events, use the ref
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_NAME="${{ github.head_ref }}"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          fi
          
          echo "Branch name: $BRANCH_NAME"
          
          if [ "$BRANCH_NAME" = "main" ] || [ "$BRANCH_NAME" = "master" ]; then
            echo "is_main=true" >> $GITHUB_OUTPUT
            echo "destination_dir=" >> $GITHUB_OUTPUT
            echo "Deploying to root"
          else
            SAFE_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9-]/-/g')
            echo "is_main=false" >> $GITHUB_OUTPUT
            echo "destination_dir=test-$SAFE_BRANCH" >> $GITHUB_OUTPUT
            echo "Deploying to test-$SAFE_BRANCH/"
          fi
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Deploy to GitHub Pages (main branch - root)
        if: steps.deploy_path.outputs.is_main == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
          force_orphan: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy ${{ steps.deploy_path.outputs.branch_name }} to GitHub Pages'

      - name: Deploy to GitHub Pages (preview - subdirectory)
        if: steps.deploy_path.outputs.is_main == 'false'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ steps.deploy_path.outputs.destination_dir }}
          keep_files: true
          force_orphan: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy ${{ steps.deploy_path.outputs.branch_name }} to GitHub Pages'
